version: 2

# The fuzz crate and the field-test client resolve the workspace crates by
# path, so a bump proposed for either of them also edits the workspace pins in
# the root Cargo.toml. The same groups therefore apply to all three
# cargo entries.

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      grpc:
        patterns: ["tonic", "tonic-*", "prost", "prost-*"]
      rustcrypto:
        patterns: ["sha2", "sha3", "hmac", "hkdf", "chacha20", "chacha20poly1305", "rand_core", "hpke", "x25519-dalek"]
  - package-ecosystem: cargo
    directory: /fieldtest/tools/remfield-io
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      grpc:
        patterns: ["tonic", "tonic-*", "prost", "prost-*"]
      rustcrypto:
        patterns: ["sha2", "sha3", "hmac", "hkdf", "chacha20", "chacha20poly1305", "rand_core", "hpke", "x25519-dalek"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rustcrypto:
        patterns: ["sha2", "sha3", "hmac", "hkdf", "chacha20", "chacha20poly1305", "rand_core", "hpke", "x25519-dalek"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
