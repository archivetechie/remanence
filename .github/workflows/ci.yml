name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The build compiles its protos with protox and needs no system protoc. A
  # path that does not exist makes any regression to protoc fail here.
  PROTOC: /nonexistent/protoc

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools attr

      - name: Install Python verifier dependencies
        run: python3 -m pip install -r tools/requirements-rem-object-independent.txt

      - name: Check specification references and preservation regressions
        run: |
          python3 tools/check_spec_versioning.py
          python3 -m unittest discover -s tools -p 'test_*spec*.py'
          python3 -m unittest discover -s tools/oracle -p 'test_*.py'

      - name: Test release evidence boundaries
        run: python3 -m unittest discover -s tools -p 'test_release_evidence.py'

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Guard core dependency graph
        run: |
          # Prospective guard: keep the core graph clean if remanence-bru is
          # introduced later. Its current absence is not a reason to remove it.
          for package in remanence-cli remanence-api; do
            if cargo tree -p "$package" -e normal --no-default-features | grep -q 'remanence-bru '; then
              echo "$package default core graph must not depend on remanence-bru" >&2
              cargo tree -p "$package" -e normal --no-default-features >&2
              exit 1
            fi
          done

      # Read-only. Shows the write-cache mode the journal trust check will
      # consult for the test temp directories, so a rejection can be told
      # apart from a runner disk that is "write back" without FUA.
      - name: Report journal-volume write cache
        run: |
          (
            for dir in "${RUNNER_TEMP:-/tmp}" /tmp; do
              echo "== $dir ($(findmnt -no SOURCE,FSTYPE -T "$dir"))"
              dev=$(stat -c '%d' "$dir")
              major=$(( ((dev >> 8) & 0xfff) | ((dev >> 32) & ~0xfff) ))
              minor=$(( (dev & 0xff) | ((dev >> 12) & ~0xff) ))
              echo "major:minor: $major:$minor"
              node=$(readlink -e "/sys/dev/block/$major:$minor")
              if [ -z "$node" ]; then
                echo "sysfs: no /sys/dev/block/$major:$minor entry (anonymous device)"
                continue
              fi
              echo "sysfs: $node"
              if [ -f "$node/partition" ]; then
                echo "partition: yes (number $(cat "$node/partition"))"
                owner=$(dirname "$node")
              else
                echo "partition: no"
                owner=$node
              fi
              echo "consulted: $owner"
              echo "queue/write_cache: $(cat "$owner/queue/write_cache" 2>&1)"
              echo "queue/fua: $(cat "$owner/queue/fua" 2>&1)"
            done
          ) || true

      - name: Run tests
        run: cargo test --workspace

      # The field-test client is outside the workspace, so the workspace build
      # never compiles it; without this step it silently drifted behind the
      # Layer 5 API until the next field window would have found it broken.
      - name: Check the field-test client builds against the current API
        run: cargo check --locked --manifest-path fieldtest/tools/remfield-io/Cargo.toml

      - name: Build warning-free API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

      - name: Verify REM-OBJECT vectors and plaintext interop
        run: python3 tools/verify_rem_object_vectors_independent.py --check-plaintext-interop

      - name: Verify publication vectors and specification consistency
        run: |
          python3 tools/verify_publication_test_vectors.py
          python3 tools/test_check_spec_versioning.py
          python3 tools/check_spec_versioning.py

      - name: Assert the published/current REM-PARITY compatibility boundary
        run: cargo test -p remanence-parity --test publication_damage_matrix

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo fetch --manifest-path fuzz/Cargo.toml --locked
          cargo audit --file Cargo.lock
          cargo audit --file fuzz/Cargo.lock
          cargo audit --file fieldtest/tools/remfield-io/Cargo.lock

      # A ratchet, not a wall. Fails only on fields that entered the contract
      # WITHOUT a presence verdict -- the ones that predate the gate are listed
      # in tools/wire-presence-baseline.txt and do not block unrelated work.
      # The debt can shrink and cannot grow. Becomes --check when it hits zero.
      - name: Wire-presence gate
        run: python3 -m pip install --quiet protobuf && python3 tools/wire_presence_census.py --check-baseline

  fuzz-corpus-replay:
    name: scheduled fuzz corpus replay
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # nightly
        with:
          toolchain: "nightly-2026-06-01"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Replay committed fuzz corpora
        run: |
          cargo fetch --manifest-path fuzz/Cargo.toml --locked
          for target in \
            rem_object_envelope_header \
            rem_object_envelope_metadata_cbor \
            rem_object_key_frame \
            rem_object_manifest_cbor \
            rem_object_plaintext_tar_loop \
            rem_object_whole_object_open_verify \
            rem_parity_bootstrap_parse \
            rem_parity_bootstrap_structured \
            rem_parity_map_parse \
            rem_parity_scan_walk \
            rem_parity_sidecar_parse
          do
            CARGO_NET_OFFLINE=true cargo fuzz run "$target" -- -runs=0
          done

  msrv:
    name: Rust 1.88 minimum-version check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.88
        with:
          toolchain: "1.88.0"
      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets --locked

  static-recovery:
    name: Static rem-recover artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust musl target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools file
      - name: Build and verify static recovery binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p rem-recover
          file target/x86_64-unknown-linux-musl/release/rem-recover | grep -E 'statically linked|static-pie linked'
          sha256sum target/x86_64-unknown-linux-musl/release/rem-recover > rem-recover-x86_64-musl.sha256
      - name: Upload recovery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rem-recover-x86_64-musl
          path: |
            target/x86_64-unknown-linux-musl/release/rem-recover
            rem-recover-x86_64-musl.sha256

  coverage:
    name: Coverage measurement
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and LLVM tools
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          components: llvm-tools-preview
      - name: Install test tools and coverage runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools attr
          cargo install cargo-llvm-cov --locked
      - name: Measure workspace coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info
