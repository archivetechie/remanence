name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  linux-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify signed tag, main ancestry, and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workspace_versions=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | .[]')
          test "$GITHUB_REF_NAME" = "v$workspace_versions"
          python3 tools/release_evidence.py gate --output dist/eligibility.json
      - name: Install Rust and musl target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-unknown-linux-musl
      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            musl-tools libarchive-tools attr
          cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Run release gates
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Linux binaries
        run: |
          cargo build --release --locked -p remanence-cli -p remanence-daemon
          cargo build --release --locked --target x86_64-unknown-linux-musl -p rem-recover
      - name: Package and checksum artifacts
        run: |
          install -d dist/remanence-x86_64-linux dist/rem-recover-x86_64-linux-musl
          cargo about generate about.hbs > dist/THIRD-PARTY-LICENSES.html
          test -s dist/THIRD-PARTY-LICENSES.html
          install -m 0755 target/release/rem target/release/rem-debug target/release/rem-daemon dist/remanence-x86_64-linux/
          install -m 0755 target/x86_64-unknown-linux-musl/release/rem-recover dist/rem-recover-x86_64-linux-musl/
          install -m 0644 LICENSE-APACHE-2.0 dist/remanence-x86_64-linux/
          install -m 0644 LICENSE-APACHE-2.0 dist/rem-recover-x86_64-linux-musl/
          install -m 0644 dist/THIRD-PARTY-LICENSES.html dist/remanence-x86_64-linux/
          install -m 0644 dist/THIRD-PARTY-LICENSES.html dist/rem-recover-x86_64-linux-musl/
          tar -C dist -czf dist/remanence-x86_64-linux.tar.gz remanence-x86_64-linux
          tar -C dist -czf dist/rem-recover-x86_64-linux-musl.tar.gz rem-recover-x86_64-linux-musl
          python3 tools/release_evidence.py record --name remanence-linux --dist dist --lock Cargo.lock
          python3 tools/release_evidence.py manifest --dist dist --lock Cargo.lock --require-build remanence-linux
      - name: Attest release payload and manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create GitHub release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.json dist/THIRD-PARTY-LICENSES.html dist/SHA256SUMS --verify-tag --generate-notes
