[package]
name = "remanence-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
remanence-aead = { path = "../crates/remanence-aead" }
remanence-format = { path = "../crates/remanence-format", features = ["fuzzing"] }
remanence-library = { path = "../crates/remanence-library" }
remanence-parity  = { path = "../crates/remanence-parity" }
sha2 = "0.10"

[[bin]]
name = "rem_object_envelope_header"
path = "fuzz_targets/rem_object_envelope_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rem_object_envelope_metadata_cbor"
path = "fuzz_targets/rem_object_envelope_metadata_cbor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rem_object_manifest_cbor"
path = "fuzz_targets/rem_object_manifest_cbor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rem_object_plaintext_tar_loop"
path = "fuzz_targets/rem_object_plaintext_tar_loop.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rem_object_whole_object_open_verify"
path = "fuzz_targets/rem_object_whole_object_open_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rem_object_key_frame"
path = "fuzz_targets/rem_object_key_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rem_parity_bootstrap_parse"
path = "fuzz_targets/rem_parity_bootstrap_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rem_parity_sidecar_parse"
path = "fuzz_targets/rem_parity_sidecar_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rem_parity_map_parse"
path = "fuzz_targets/rem_parity_map_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rem_parity_scan_walk"
path = "fuzz_targets/rem_parity_scan_walk.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
