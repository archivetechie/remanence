[package]
name        = "remanence-cli"
description = "rem — the operator-facing CLI for Remanence (discovery, inspection)."
version     .workspace = true
edition     .workspace = true
rust-version.workspace = true
authors     .workspace = true
license = "Apache-2.0"
publish.workspace = true
repository  .workspace = true

[[bin]]
name = "rem"
path = "src/main.rs"

[[bin]]
name = "rem-debug"
path = "src/rem_debug.rs"

[[bin]]
name = "rem-dev"
path = "src/rem_dev.rs"
required-features = ["fixtures"]

[dependencies]
toml_edit = "0.25"
remanence-aead    = { path = "../remanence-aead" }
remanence-chaos   = { path = "../remanence-chaos" }
remanence-format  = { path = "../remanence-format" }
remanence-format-driver = { path = "../remanence-format-driver" }
remanence-library = { path = "../remanence-library" }
remanence-parity  = { path = "../remanence-parity" }
remanence-state   = { path = "../remanence-state" }
remanence-stream  = { path = "../remanence-stream" }
remanence-api     = { path = "../remanence-api" }
base64            = { workspace = true }
crossterm         = { version = "0.29", optional = true }
ciborium          = { workspace = true }
clap              = { workspace = true }
libc              = { workspace = true }
prost-types       = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
toml              = { workspace = true }
sha2              = { workspace = true }
tempfile          = { workspace = true }
time              = { workspace = true }
tokio             = { workspace = true }
tokio-stream      = { workspace = true, features = ["net"] }
tonic             = { workspace = true }
uuid              = { workspace = true }
xattr             = { workspace = true }
zeroize           = { workspace = true }
ratatui           = { version = "0.30", optional = true }

[dev-dependencies]
# Enable the dev binary for ordinary cargo test/clippy target selection only.
remanence-cli = { path = ".", features = ["fixtures"] }
remanence-state = { path = "../remanence-state", features = ["fixtures"] }
remanence-daemon = { path = "../remanence-daemon" }
hyper-util = { workspace = true, features = ["tokio"] }
tower = { workspace = true, features = ["util"] }
remanence-parity = { path = "../remanence-parity", features = ["test-support", "fixtures"] }
tempfile = { workspace = true }

[features]
# Only rem-dev and test invocations opt into destructive authority fixtures.
fixtures = ["remanence-parity/fixtures", "remanence-state/fixtures"]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

# Enables the `rem watch` subcommand by pulling in the
# `linux-udev` backend from `remanence-library` and a tokio runtime.
# Linux-only at build time; requires `pkg-config` + `libudev-dev`
# system packages.
linux-udev = ["remanence-library/linux-udev"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
