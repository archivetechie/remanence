[package]
name        = "remanence-parity"
description = "Layer 3c — Reed-Solomon parity protection for on-tape data in Remanence."
version     .workspace = true
edition     .workspace = true
rust-version.workspace = true
authors     .workspace = true
license = "Apache-2.0"
publish.workspace = true
repository  .workspace = true

[features]
# Deliberately destructive semantic fixtures; never enabled by production binaries.
fixtures = []
# Compile-time seam for cross-crate verification equivalence tests.
test-support = []

[dependencies]
# Sibling layer (not stacked): parity and body-format compose above this crate.
# remanence-format is NOT a dep; the BlockSink / BlockSource
# traits live in remanence-library::block_io so 3b and 3c can
# both depend on the library crate as true siblings.
remanence-library = { path = "../remanence-library" }
remanence-crc     = { path = "../remanence-crc" }

# Accelerates GF(2^8)/0x11D slice multiply-add and supplies the
# `ParityError::ReedSolomon` compatibility surface. The codec constructs
# Layer 3c v0.4.4 Appendix A's Cauchy matrix directly.
reed-solomon-erasure = { workspace = true }

# Catalog / bootstrap framing: CBOR for bootstrap payloads and HMAC-SHA256
# for per-tape sidecar magic derivation.
ciborium  = { workspace = true }
hmac      = { workspace = true }
sha2      = { workspace = true }
nix       = { workspace = true }
serde     = { workspace = true }
time      = { workspace = true }
tracing   = { workspace = true }
tempfile  = { workspace = true }

# Error enum.
thiserror = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[dev-dependencies]
remanence-parity = { path = ".", features = ["fixtures"] }
remanence-chaos = { path = "../remanence-chaos" }
serde_json = { workspace = true }
