// Remanence Layer 5 — gRPC API surface (DRAFT v0.1).
//
// Status: design draft. Generated into remanence-api; no wire-stability promise.
// Authoritative reference for terminology and contracts: docs/spec-v0.4.md.
//
// Transport: HTTPS/2 with mTLS authentication (mutual cert auth at the channel
// layer; per-request authorization is enforced server-side per audit policy).
//
// Conventions:
//   - All bytes-typed identity fields carry binary hashes (SHA-256 = 32 bytes,
//     CRC-64 = 8 bytes). Hex/base64 conversion is a client concern.
//   - All timestamps are RFC3339 UTC, transported as google.protobuf.Timestamp.
//   - "Tape" identity is by tape UUID (assigned by Remanence the first time a
//     cartridge is seen); the operator-facing label is `voltag` and is non-
//     authoritative.
//   - "Object" identity is by Remanence-assigned object UUID. The orchestrator's
//     own identifier rides as `caller_object_id` (an opaque string) and is
//     stored on tape alongside the data per docs/spec-v0.4.md §4.2.
//   - Idempotency: fields are reserved on state-changing RPCs. Until per-RPC
//     replay is implemented, non-empty keys fail fast with UNIMPLEMENTED rather
//     than being silently accepted.
//   - Pagination: list RPCs return a `next_page_token`; opaque to clients.
//   - Cancellation: long-running operations return an `operation_id`; cancel
//     via Daemon.CancelOperation.
//
// What this draft does NOT yet pin:
//   - Concrete enum values for error codes beyond the canonical gRPC status.
//   - Detailed write-format-specific options (rem-tar-v1 vs future formats).
//   - Multi-library naming and routing details.
//   - Subscription/notification streams (operation updates, library events).
//   - Per-RPC authorization is enforced by the server using the role model in
//     docs/spec-v0.4.md §11.6; certificate subject encoding is deployment policy.

syntax = "proto3";

package remanence.api.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// =============================================================================
// COMMON MESSAGES
// =============================================================================

// Opaque identifier the caller supplies to deduplicate retries of a state-
// changing RPC. Per layer4 addendum §6.1: persisted with actor fingerprint.
message IdempotencyKey {
  // Caller-provided UUID. 16 bytes. Must be unique per (actor, request).
  bytes value = 1;
}

// Server-assigned identifier for a long-running operation. Returned by
// asynchronous RPCs; used to query status, cancel, or correlate audit events.
message OperationRef {
  bytes operation_id = 1; // 16-byte UUID assigned by daemon.
}

// A digest claim whose algorithm remains explicit and independently evolvable.
// Writers currently emit only algorithm="sha256".
message Digest {
  string algorithm = 1;
  bytes value       = 2;
}

// State of a long-running operation.
enum OperationState {
  reserved 6;
  reserved "OPERATION_STATE_UNKNOWN";
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_QUEUED      = 1;
  OPERATION_STATE_RUNNING     = 2;
  OPERATION_STATE_SUCCEEDED   = 3;
  OPERATION_STATE_FAILED      = 4;
  OPERATION_STATE_CANCELLED   = 5;
  // A completed attempt whose durable outcome cannot be established. This is
  // distinct from UNSPECIFIED, which means no state was supplied.
  OPERATION_STATE_COMPLETION_UNKNOWN = 7;
}

message OperationStatus {
  bytes operation_id           = 1;
  string operation_kind        = 2;
  OperationState state         = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  // Free-form progress payload (e.g., bytes_written, current_lba, etc.).
  // Keys are operation-kind-specific.
  map<string, string> progress = 6;
  // On failure, a human-readable summary; structured detail in audit log.
  string error_summary         = 7;
}

// Pagination — opaque tokens, server-controlled page sizes.
message PageToken {
  bytes value = 1;
}

// =============================================================================
// DAEMON SERVICE — process-level introspection and operation control.
// =============================================================================

service Daemon {
  rpc Health  (google.protobuf.Empty) returns (HealthResponse);
  rpc Version (google.protobuf.Empty) returns (VersionResponse);

  // Operation lifecycle, applicable across all services that return OperationRef.
  rpc GetOperation    (GetOperationRequest)    returns (OperationStatus);
  rpc ListOperations  (ListOperationsRequest)  returns (ListOperationsResponse);
  rpc CancelOperation (CancelOperationRequest) returns (CancelOperationResponse);

  // Server-streaming progress for an operation (alternative to polling
  // GetOperation). The stream closes when the operation reaches a terminal
  // state.
  rpc WatchOperation  (GetOperationRequest)    returns (stream OperationStatus);
}

message HealthResponse {
  enum Status {
    STATUS_UNSPECIFIED   = 0;
    STATUS_HEALTHY       = 1;
    STATUS_READ_ONLY     = 2; // degraded — write path disabled, reads OK
    STATUS_DEGRADED      = 3; // some libraries unreachable, etc.
    STATUS_FAILED        = 4;
  }
  Status status            = 1;
  // Per-component summary (e.g., "library:7CBAD9CF74" → "healthy").
  // Deprecated compatibility view; use component_health.
  map<string, string> components = 2;
  string detail            = 3;
  repeated ComponentHealth component_health = 4;
}

message ComponentHealth {
  string component = 1;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_HEALTHY = 1;
    STATUS_READ_ONLY = 2;
    STATUS_DEGRADED = 3;
    STATUS_FAILED = 4;
    // `other_status` carries the unrecognized implementation-specific value.
    STATUS_OTHER = 5;
  }
  Status status = 2;
  string other_status = 3;
}

message VersionResponse {
  string daemon_version    = 1; // e.g., "0.4.1+abc1234"
  string api_version       = 2; // e.g., "v1"
  string rust_target       = 3; // e.g., "x86_64-unknown-linux-gnu"
}

message GetOperationRequest    { bytes operation_id = 1; }

message ListOperationsRequest {
  // Filter: empty = all. Examples: "kind=write_session",
  // "state=running", "since=2026-05-25T00:00:00Z".
  map<string, string> filter = 1;
  PageToken page_token       = 2;
  uint32 page_size           = 3;
}

message ListOperationsResponse {
  repeated OperationStatus operations = 1;
  PageToken next_page_token           = 2;
}

message CancelOperationRequest {
  bytes operation_id      = 1;
  IdempotencyKey idempotency_key = 2;
  // True: best-effort interrupt (CDB completion may still arrive).
  // False: only cancel if not yet dispatched.
  bool force              = 3;
}

message CancelOperationResponse {
  OperationState resulting_state = 1; // CANCELLED, RUNNING (rejected), etc.
  string detail                  = 2;
}

// =============================================================================
// LIBRARY SERVICE — Layer 2 surface: inventory and state-changing ops.
// =============================================================================

service LibraryService {
  rpc ListLibraries     (google.protobuf.Empty)       returns (ListLibrariesResponse);
  rpc GetLibrary        (GetLibraryRequest)           returns (LibraryState);
  rpc RefreshInventory  (RefreshInventoryRequest)     returns (OperationRef);
  rpc ListDrives        (ListDrivesRequest)           returns (ListDrivesResponse);
  rpc GetDrive          (GetDriveRequest)             returns (DriveCatalogEntry);
  rpc GetDriveHistory   (GetDriveHistoryRequest)      returns (GetDriveHistoryResponse);
  rpc AnnotateDrive     (AnnotateDriveRequest)        returns (DriveCatalogEntry);
  rpc RetireDrive       (RetireDriveRequest)          returns (RetireDriveResponse);
  rpc ReinstateDrive    (ReinstateDriveRequest)       returns (ReinstateDriveResponse);
  rpc PollDrive         (PollDriveRequest)            returns (DriveHealthSnapshot);
  rpc CleanDrive        (CleanDriveRequest)           returns (OperationRef);
  // Resume an existing durable media-readiness fence in place. Progress is
  // observed through Daemon.WatchOperation using the returned operation id.
  rpc ResumeMediaReadiness (ResumeMediaReadinessRequest) returns (OperationRef);
  rpc ListAlarms        (ListAlarmsRequest)           returns (ListAlarmsResponse);
  rpc AckAlarm          (AckAlarmRequest)             returns (Alarm);
  rpc GetLiveStatus     (GetLiveStatusRequest)        returns (GetLiveStatusResponse);

  // State-changing ops. All return OperationRef; observe via Daemon.GetOperation
  // or Daemon.WatchOperation.
  rpc MoveMedium        (MoveMediumRequest)           returns (OperationRef);
  rpc LoadDrive         (LoadDriveRequest)            returns (OperationRef);
  rpc UnloadDrive       (UnloadDriveRequest)          returns (OperationRef);
  rpc ImportElement     (ImportElementRequest)        returns (OperationRef);
  rpc ExportElement     (ExportElementRequest)        returns (OperationRef);

  // Server-streaming hot-plug / library state events (Layer 2c). Each event
  // is a delta against the last observed LibraryState.
  rpc StreamLibraryEvents (StreamLibraryEventsRequest) returns (stream LibraryEvent);
}

message Library {
  string library_serial   = 1;  // SCSI VPD page 0x80 unit serial.
  string vendor           = 2;
  string product          = 3;
  string product_revision = 4;
  // Stable serial assigned at first discovery (UUID), independent of SCSI
  // serial which can change with firmware re-flash on some vendors.
  bytes  library_uuid     = 5;
}

message LibraryState {
  Library library          = 1;
  repeated Drive drives    = 2;
  repeated Slot  slots     = 3;
  repeated PortalSlot import_export_ports = 4;
  google.protobuf.Timestamp last_inventory_at = 5;
  string managed           = 6; // "rem" or "foreign" for drive-stewardship views.
}

// How the drive catalog answered when the live-status projection looked up the
// drive occupying a changer-reported bay.
enum DriveCatalogState {
  DRIVE_CATALOG_STATE_UNSPECIFIED = 0;
  // An active catalog row was found; drive_uuid and the catalog-derived fields
  // are populated.
  DRIVE_CATALOG_STATE_CATALOGED   = 1;
  // The bay's only catalog row is retired. Identity is still reported, and the
  // drive is excluded from mount resolution and every selection path.
  DRIVE_CATALOG_STATE_RETIRED     = 2;
  // The changer reports this bay but the catalog holds no row for it. Identity
  // and every catalog-derived field are absent, not zero.
  DRIVE_CATALOG_STATE_UNCATALOGUED = 3;
  // More than one catalog row claims this bay. The reported identity is the
  // most recently seen active row; the condition needs operator attention.
  DRIVE_CATALOG_STATE_AMBIGUOUS   = 4;
}

// A live report about one drive bay, as the daemon currently understands it.
//
// Almost every field here is `optional`, and that is the honest shape: this
// message is an OBSERVATION, and each part of the observation is separately
// capable of failing. The changer reports a bay; a host-side INQUIRY supplies
// the identity; the catalog supplies the history; the transfer engine supplies
// the telemetry. Any of those can be unavailable while the others succeed.
//
// The cost of getting this wrong is on record. `drive_serial` was a plain
// string, so a bay whose identity lookup failed reported an empty serial --
// indistinguishable from a bay with no drive in it. That defect took a month to
// find, because every layer above faithfully passed on a value that was never
// true. The rule now is the plain one: if a value can be unknown, it is
// `optional`; if it must always be known, it is not.
//
// Telemetry deserves a specific note. A gap of 0us is an excellent measurement.
// No measurement at all is not a measurement of zero. When these were plain,
// an idle drive and a perfectly-performing drive produced identical bytes.
message Drive {
  optional uint32 element_address  = 1;  // library-reported bay; absent for a drive the changer cannot see
  optional string drive_serial     = 2;  // joined from host-side INQUIRY; absent when the join fails
  optional string host_device_path = 3;  // e.g., /dev/sg7; absent when no host device is matched
  optional string vendor           = 4;  // from INQUIRY
  optional string product          = 5;  // from INQUIRY
  // Loaded tape (UUID). Absent means either no cartridge or a cartridge whose
  // identity could not be read -- `status` distinguishes those.
  optional bytes  loaded_tape_uuid = 6;
  enum Status {
    DRIVE_STATUS_UNSPECIFIED   = 0;
    DRIVE_STATUS_IDLE          = 1;
    DRIVE_STATUS_LOADED        = 2;
    DRIVE_STATUS_BUSY          = 3;
    DRIVE_STATUS_UNREACHABLE   = 4;
    DRIVE_STATUS_CLEANING      = 5;
    DRIVE_STATUS_FENCED        = 6;
  }
  Status status           = 7;           // always known: UNSPECIFIED already says "unknown"
  // Catalog identity. Absent ONLY when catalog_state is UNCATALOGUED, i.e. the
  // changer reports a bay for which the drive catalog holds no row at all.
  // A retired drive keeps its identity and is reported with catalog_state
  // RETIRED; consumers must not infer absence of a drive from an absent value.
  optional bytes  drive_uuid       = 8;
  optional string cleaning_due     = 9;
  optional bool   fenced           = 10;  // unknown for a bay with no catalog row
  optional uint64 lifetime_read_bytes = 11;   // 0 bytes is a real answer for a new drive
  optional uint64 lifetime_write_bytes = 12;  // 0 bytes is a real answer for a new drive
  optional uint64 counter_epoch    = 13;
  optional bytes  session_id       = 14;  // absent when the drive is not in a session
  repeated string active_alert_names = 15;
  reserved 16;
  reserved "tape_io_pipelined_submission";
  optional uint32 tape_io_staging_ring_buffers = 17;
  optional uint32 tape_io_effective_batch_blocks = 18;
  optional uint64 tape_io_gap_p50_us = 19;
  optional uint64 tape_io_gap_p95_us = 20;
  optional uint64 tape_io_gap_max_us = 21;
  optional uint64 tape_io_ioctl_p50_us = 22;
  optional uint64 tape_io_ioctl_p95_us = 23;
  optional uint64 tape_io_ioctl_max_us = 24;
  optional uint64 tape_io_cadence_us = 25;
  // Cumulative average over the current/most recently published transfer.
  optional uint64 tape_io_effective_feed_bytes_per_second = 26;
  // Changer-reported seated cartridge barcode. Absent means either no cartridge
  // or a cartridge whose label could not be read.
  optional string loaded_tape_barcode = 27;
  // Seconds since this daemon first observed the current barcode seated in this
  // bay. Absent when nothing is seated, or when the daemon has not observed the
  // seating -- a fresh mount reads 0, which is why absence must be separable.
  optional uint64 mount_age_seconds = 28;
  // Combined read/write byte rate over the daemon's rolling ~5 second window.
  optional uint64 tape_io_window_feed_bytes_per_second = 29;
  // How the drive catalog answered for this bay. Present on every row, so a
  // consumer never has to infer catalog state from an absent identity.
  DriveCatalogState catalog_state = 30;   // always known: UNSPECIFIED already says "unknown"
}

// A row of the drive catalog. Field presence here MIRRORS the nullability of
// the `drives` table, column for column: a column declared NOT NULL is a plain
// field, a nullable column is `optional`. That is not a convention, it is the
// only honest mapping — a plain field promises the value is always known, and
// the proto has no business promising what the storage does not.
//
// tools/wire_presence_census.py records the verdict per field; the derivation
// is the schema itself, so a future column that gains or loses NOT NULL must
// move its field with it.
message DriveCatalogEntry {
  bytes drive_uuid = 1;                    // primary key: always known
  optional string serial = 2;              // drives.serial is nullable: INQUIRY can fail
  string identity_source = 3;              // NOT NULL
  bool actionable = 4;                     // NOT NULL DEFAULT 1
  optional string vendor = 5;              // nullable
  optional string product = 6;             // nullable
  optional string firmware_rev = 7;        // nullable
  string managed = 8;                      // NOT NULL
  string state = 9;                        // NOT NULL DEFAULT 'active'
  string cleaning_due = 10;                // NOT NULL DEFAULT 'none'
  bool fenced = 11;                        // NOT NULL DEFAULT 0
  google.protobuf.Timestamp first_seen_utc = 12;
  google.protobuf.Timestamp last_seen_utc = 13;
  optional string last_library_serial = 14;   // nullable: never seen in a library
  optional uint32 last_element_address = 15;  // nullable; bay 0 is also a real bay
  optional string purchase_date = 16;      // nullable: operator-supplied, often absent
  optional string warranty_until = 17;     // nullable
  optional string cost = 18;               // nullable
  optional string notes = 19;              // nullable
  google.protobuf.Timestamp retired_at_utc = 20;
  optional string retire_reason = 21;      // nullable: set only on retirement
  repeated DriveCorrelationRollup correlation_rollups = 22;
}

message DriveCorrelationRollup {
  bytes tape_uuid = 1;
  string voltag = 2;
  bytes drive_uuid = 3;
  string drive_serial = 4;
  uint64 session_count = 5;
  uint64 snapshot_count = 6;
  uint64 write_errors_corrected = 7;
  uint64 write_errors_uncorrected = 8;
  uint64 read_errors_corrected = 9;
  uint64 read_errors_uncorrected = 10;
  google.protobuf.Timestamp first_session_utc = 11;
  google.protobuf.Timestamp last_session_utc = 12;
}

message DriveHistoryEvent {
  uint64 event_id = 1;
  bytes drive_uuid = 2;
  string event_kind = 3;
  google.protobuf.Timestamp at_utc = 4;
  string library_serial = 5;
  uint32 element_address = 6;
  bytes tape_uuid = 7;
  string detail = 8;
}

// Presence mirrors `drive_health_snapshots` nullability, as for DriveCatalogEntry.
//
// The four error counters matter most here: zero corrected errors is a real and
// good reading, and "the log page could not be read" is a completely different
// fact about the drive. Collapsing the second into the first reports a healthy
// drive when what actually happened is that nobody could tell.
message DriveHealthSnapshot {
  uint64 snapshot_id = 1;                  // primary key: always known
  bytes drive_uuid = 2;                    // NOT NULL
  google.protobuf.Timestamp at_utc = 3;    // NOT NULL
  string trigger = 4;                      // NOT NULL
  // Deprecated canonical UUID text retained for compatibility.
  optional string session_id = 5;          // nullable: snapshot need not be in a session
  optional string tape_alert_flags = 6;    // nullable: log-page read can fail
  optional uint64 write_errors_corrected = 7;    // nullable; 0 errors is a real reading
  optional uint64 write_errors_uncorrected = 8;  // nullable
  optional uint64 read_errors_corrected = 9;     // nullable
  optional uint64 read_errors_uncorrected = 10;  // nullable
  optional string raw_pages = 11;          // nullable
  // Canonical 16-byte UUID form shared with Drive.session_id and
  // DriveAssignment.current_session_id. Derived from session_id, so it is
  // absent exactly when that is.
  optional bytes session_uuid = 12;
}

message Alarm {
  uint64 alarm_id = 1;
  string condition_key = 2;
  string kind = 3;
  string severity = 4;
  string state = 5;
  google.protobuf.Timestamp first_seen_utc = 6;
  google.protobuf.Timestamp last_seen_utc = 7;
  string acked_by = 8;
  google.protobuf.Timestamp acked_at_utc = 9;
  string detail = 10;
}

message ListDrivesRequest {
  bool include_foreign = 1;
  bool include_retired = 2;
  PageToken page_token = 3;
  uint32 page_size = 4;
}

message ListDrivesResponse {
  repeated DriveCatalogEntry drives = 1;
  PageToken next_page_token = 2;
}

message GetDriveRequest {
  string drive = 1; // drive UUID text or device-reported serial.
}

message GetDriveHistoryRequest {
  string drive = 1; // drive UUID text or device-reported serial.
  bool include_events = 2;
  bool include_snapshots = 3;
  PageToken page_token = 4;
  uint32 page_size = 5;
}

message GetDriveHistoryResponse {
  DriveCatalogEntry drive = 1;
  repeated DriveHistoryEvent events = 2;
  repeated DriveHealthSnapshot snapshots = 3;
  PageToken next_page_token = 4;
}

message AnnotateDriveRequest {
  bytes drive_uuid = 1;
  string purchase_date = 2;
  string warranty_until = 3;
  string cost = 4;
  string note = 5;
  string notes_set = 6;
  bool allow_derived_identity = 7;
}

message RetireDriveRequest {
  bytes drive_uuid = 1;
  string reason = 2;
  // 3 held an acknowledgement that fleet removal was permanent. It is not:
  // ReinstateDrive returns a retired drive to service.
  reserved 3;
  reserved "i_understand_fleet_removal_is_permanent";
  bool allow_derived_identity = 4;
}

message ReinstateDriveRequest {
  bytes drive_uuid = 1;
  string reason = 2;
  bool allow_derived_identity = 3;
}

message ReinstateDriveResponse {
  DriveCatalogEntry drive = 1;
  bool newly_reinstated = 2;
}

message RetireDriveResponse {
  DriveCatalogEntry drive = 1;
  bool newly_retired = 2;
}

message PollDriveRequest {
  string drive = 1; // drive UUID text or device-reported serial.
  bool allow_derived_identity = 2;
}

message CleanDriveRequest {
  bytes drive_uuid = 1;
  bool allow_derived_identity = 2;
  IdempotencyKey idempotency_key = 3;
}

message ListAlarmsRequest {
  bool include_cleared = 1;
  PageToken page_token = 2;
  uint32 page_size = 3;
}

message ListAlarmsResponse {
  repeated Alarm alarms = 1;
  PageToken next_page_token = 2;
}

message AckAlarmRequest {
  string condition_key = 1;
  IdempotencyKey idempotency_key = 2;
}

message GetLiveStatusRequest {}

// Advisory projection of the existing per-bay atomic reservation. Consumers
// must key arbitration on (library_serial, bay), never drive_uuid: a physical
// drive identity can move to another bay after swap or retirement.
message DriveAssignment {
  string library_serial = 1;
  uint32 bay = 2;
  // Operator-legibility hint only; not an arbitration key.
  optional bytes drive_uuid = 3;
  enum State {
    DRIVE_ASSIGNMENT_STATE_UNSPECIFIED = 0;
    DRIVE_ASSIGNMENT_STATE_IDLE = 1;
    DRIVE_ASSIGNMENT_STATE_ACTIVE = 2;
  }
  State state = 4;
  // Empty during reservation/mount transitions and non-session operations.
  optional bytes current_session_id = 5;
  // Empty when no cataloged tape is known to be loaded in this bay.
  optional bytes loaded_tape_uuid = 6;
}

message GetLiveStatusResponse {
  repeated LibraryState libraries = 1;
  repeated OperationRef operations = 2;
  repeated Alarm alarms = 3;
  string snapshot_at_utc = 4;
  uint64 daemon_epoch = 5;
  // Advisory only. The atomic per-bay reservation remains sole enforcement.
  repeated DriveAssignment drive_assignments = 6;
}

message Slot {
  uint32 element_address  = 1;
  // Voltag (operator-visible cartridge label). Empty if slot is empty.
  optional string voltag           = 2;
  // Remanence UUID for the cartridge in this slot. Empty if slot is empty.
  optional bytes  tape_uuid        = 3;
}

message PortalSlot {
  uint32 element_address  = 1;
  optional string voltag           = 2;
  optional bytes  tape_uuid        = 3;
  enum Direction {
    PORTAL_DIRECTION_UNSPECIFIED = 0;
    PORTAL_DIRECTION_IMPORT      = 1;
    PORTAL_DIRECTION_EXPORT      = 2;
  }
  Direction last_direction = 4;
}

message ListLibrariesResponse {
  repeated Library libraries = 1;
}

message GetLibraryRequest {
  bytes library_uuid = 1;
}

message RefreshInventoryRequest {
  bytes library_uuid              = 1;
  IdempotencyKey idempotency_key  = 2;
}

message MoveMediumRequest {
  bytes library_uuid              = 1;
  uint32 source_element_address   = 2;
  uint32 destination_element_address = 3;
  IdempotencyKey idempotency_key  = 4;
}

message LoadDriveRequest {
  bytes library_uuid              = 1;
  uint32 slot_element_address     = 2;
  uint32 drive_element_address    = 3;
  IdempotencyKey idempotency_key  = 4;
  // Skip the post-load TEST UNIT READY wait and preserve legacy behavior.
  bool no_wait                    = 5;
}

message ResumeMediaReadinessRequest {
  // Durable media-readiness operation UUID returned in a readiness fence.
  bytes operation_id            = 1;
  // Bounded wait parameters. Both must be non-zero.
  uint32 timeout_seconds        = 2;
  uint32 poll_interval_seconds  = 3;
}

message UnloadDriveRequest {
  bytes library_uuid              = 1;
  uint32 drive_element_address    = 2;
  // Destination slot. If unspecified, daemon picks a free slot.
  uint32 destination_slot_address = 3;
  IdempotencyKey idempotency_key  = 4;
}

message ImportElementRequest {
  bytes library_uuid              = 1;
  uint32 portal_element_address   = 2;
  uint32 destination_slot_address = 3;
  IdempotencyKey idempotency_key  = 4;
}

message ExportElementRequest {
  bytes library_uuid              = 1;
  uint32 source_slot_address      = 2;
  uint32 portal_element_address   = 3;
  IdempotencyKey idempotency_key  = 4;
}

message StreamLibraryEventsRequest {
  bytes library_uuid = 1;
  // If set, server replays events since this watermark; else live-only.
  google.protobuf.Timestamp since = 2;
}

message LibraryEvent {
  google.protobuf.Timestamp at = 1;
  enum Kind {
    LIBRARY_EVENT_UNSPECIFIED      = 0;
    LIBRARY_EVENT_INVENTORY_DELTA  = 1; // slots / drive contents changed
    LIBRARY_EVENT_HOTPLUG          = 2; // udev notification observed
    LIBRARY_EVENT_DRIVE_STATE      = 3; // drive transitioned IDLE/LOADED/BUSY
    LIBRARY_EVENT_HARDWARE_WARNING = 4; // tape-alert page, drive logs
    LIBRARY_EVENT_UNREACHABLE      = 5; // library or drive lost
  }
  Kind kind                       = 2;
  // Free-form structured detail, kind-specific.
  map<string, string> detail      = 3;
}

// =============================================================================
// CATALOG SERVICE — Layer 4 query surface over committed tape contents.
//
// This is the orchestrator's primary read surface. It powers the rebuildable-
// index discipline: every query here can be answered from on-tape state alone
// (the SQLite index is a cache; see layer4 addendum §6).
// =============================================================================

service Catalog {
  rpc ListTapes        (ListTapesRequest)        returns (ListTapesResponse);
  rpc GetTape          (GetTapeRequest)          returns (Tape);
  // Read the terminal triple index of one exact tape through the same
  // exact-tape/read owner used by ordinary read sessions. This is a bounded
  // fast inventory, not a whole-tape physical verification.
  rpc GetTapeInventory (TapeInventoryRequest)    returns (stream TapeInventoryStreamItem);
  // Perform the slow physical verification: measure EOD, walk the complete
  // prefix, compare its canonical map, and read all three replicas and both
  // typed separation extents. This is distinct from GetTapeInventory.
  rpc VerifyTapeIndex  (VerifyTapeIndexRequest)  returns (TapeIndexVerification);
  rpc ListTapeFiles    (ListTapeFilesRequest)    returns (ListTapeFilesResponse);
  rpc ListTapePools    (ListTapePoolsRequest)    returns (ListTapePoolsResponse);
  rpc GetTapePool      (GetTapePoolRequest)      returns (TapePool);

  // Stream every object on a tape, in order. This is the core enumeration RPC
  // the orchestrator calls to (re)build its catalog. Each item carries the
  // logical identity (content_sha256) plus the on-tape locator (tape + file +
  // BodyLba per rem-tar-v1 §2.1).
  rpc EnumerateObjects (EnumerateObjectsRequest) returns (stream ObjectRecord);

  // Single-object lookup.
  rpc GetObject        (GetObjectRequest)        returns (ObjectRecord);

  // "Where are all the copies of this object?" — the multi-copy answer
  // for one logical object across every known tape on this daemon.
  rpc FindObjectCopies (FindObjectCopiesRequest) returns (FindObjectCopiesResponse);

  // Reconciliation: ask the daemon to (re-)read a tape's catalog and emit
  // a fresh enumeration that bypasses the SQLite cache. Slow; intended for
  // periodic scrub or after suspected drift.
  rpc ReconcileTape    (ReconcileTapeRequest)    returns (OperationRef);

  // Permanently finalize an exact reconciled tape at its current Object
  // boundary. This is valid below the pool low watermark and bypasses only
  // that automatic trigger; all fit, fence, ownership, and format checks stay
  // mandatory. An accepted request can never reopen the tape for Objects.
  rpc FinalizeTape     (FinalizeTapeRequest)      returns (TapeFinalization);
  rpc GetTapeFinalization (GetTapeFinalizationRequest) returns (TapeFinalization);

  // Body-format-aware queries. The daemon delegates to the registered
  // format adapter (rem-tar-v1, rem-tar-legacy, rem-bru, future).
  rpc ListFilesInObject (ListFilesInObjectRequest) returns (ListFilesInObjectResponse);
  rpc GetFile           (GetFileRequest)           returns (FileRecord);

  // Cross-source catalog view for native Remanence objects and foreign
  // read-only archives such as BRU or legacy tar. This is additive: native
  // object APIs above remain the orchestrator hot path.
  rpc EnumerateUnits    (EnumerateUnitsRequest)    returns (stream CatalogUnit);
  rpc GetCatalogUnit    (GetCatalogUnitRequest)    returns (CatalogUnit);
  rpc ListEntriesInUnit (ListEntriesInUnitRequest) returns (ListEntriesInUnitResponse);
}

// Presence mirrors the `tapes` table, column for column, as for the drive
// messages. Nearly every column there is nullable, and for good reason: a tape
// can be known to exist -- inventoried from a barcode -- long before anything
// has read its format, its block size or its parity scheme.
//
// Field 13 below already said this, and named the precedent it was avoiding:
// block_size_bytes used 0 for unknown. That is now fixed rather than worked
// around, so the warning in its comment no longer describes live behaviour.
message Tape {
  bytes tape_uuid              = 1;  // primary key: always known
  optional string voltag       = 2;  // tapes.voltag is nullable
  // "rem-tar-v1", "tar-legacy", "bru", ... Absent until something has read the
  // volume far enough to say; an inventoried tape has a barcode and no format.
  optional string body_format  = 3;
  // Absent means nobody has read the volume's block size. It is never zero: a
  // zero block size is not a tape, and treating unknown as 0 is precisely the
  // conflation field 13 was written to avoid.
  optional uint64 block_size_bytes = 4;
  // Parity scheme summary (per layer4 addendum tapes table). All three columns
  // are nullable and are absent together on an unscanned volume; an unprotected
  // tape is a scheme that says so, not a scheme of zero parity blocks.
  optional uint32 data_blocks_per_stripe   = 5;
  optional uint32 parity_blocks_per_stripe = 6;
  optional uint32 stripes_per_neighborhood = 7;
  // Absent means no tape file has been committed, which is not the same as
  // having committed tape file 0 -- the first one.
  optional uint64 last_committed_tape_file = 8;
  enum State {
    TAPE_STATE_UNSPECIFIED = 0;
    TAPE_STATE_INVENTORIED = 1; // known but not yet catalog-scanned
    TAPE_STATE_READY       = 2;
    TAPE_STATE_DEGRADED    = 3;
    TAPE_STATE_FAILED      = 4;
    TAPE_STATE_SEALED      = 5;
    TAPE_STATE_FINALIZING  = 6;
    TAPE_STATE_FINALIZED_DEGRADED = 7;
    TAPE_STATE_COMPLETION_UNKNOWN = 8;
    TAPE_STATE_RECOVERY_REQUIRED = 9;
    TAPE_STATE_RETIRED = 10;
  }
  State state                  = 9;  // NOT NULL; UNSPECIFIED already says "unknown"
  google.protobuf.Timestamp updated_at = 10;
  // Current operator/orchestrator pool assignment. Absent means unassigned.
  optional string pool_id      = 11;
  repeated DriveCorrelationRollup correlation_rollups = 12;
  // Written extent: the maximum barrier-proved EOD LBA over this volume's
  // checkpoint records — a measurement that covers trailing sidecars,
  // parity maps and checkpoint files by construction, never a rollup over
  // object commits. Exclusive: last written block + 1. Absent = no barrier
  // has proved one; absent is never zero.
  optional uint64 written_extent_lba = 13;
  // Catalog classification is required when ListTapes kind="all" mixes data
  // and cleaning rows. Absent is reserved for older peers.
  optional string kind = 14;
  // Stable parity implementation identifier; widths alone do not identify the
  // codec. Absent on no-parity or not-yet-inventoried rows.
  optional string scheme_id = 15;
  // Monotonic exact pool-assignment generation from the catalog row.
  uint64 assignment_generation = 16;
}

message FinalizeTapeRequest {
  // Exact 16-byte Remanence tape UUID. Voltags are deliberately not accepted.
  bytes tape_uuid = 1;
  // Wire-optional so an unpooled tape can be finalized. If the tape is pooled,
  // this field is mandatory and must equal the assignment reread under the
  // per-tape owner.
  optional string expected_pool_id = 2;
  // Exact non-empty operator reason preserved in audit/idempotency authority.
  string reason = 3;
  // Required durable key, scoped by actor and operation kind.
  IdempotencyKey idempotency_key = 4;
}

message GetTapeFinalizationRequest {
  bytes tape_uuid = 1;
}

enum TapeFinalizationProgress {
  TAPE_FINALIZATION_PROGRESS_UNSPECIFIED = 0;
  TAPE_FINALIZATION_PROGRESS_BEFORE_REPLICA_A = 1;
  TAPE_FINALIZATION_PROGRESS_AFTER_REPLICA_A = 2;
  TAPE_FINALIZATION_PROGRESS_AFTER_SEPARATION_AB = 3;
  TAPE_FINALIZATION_PROGRESS_AFTER_REPLICA_B = 4;
  TAPE_FINALIZATION_PROGRESS_AFTER_SEPARATION_BC = 5;
  TAPE_FINALIZATION_PROGRESS_AFTER_REPLICA_C = 6;
}

enum TapeFinalizationOutcome {
  TAPE_FINALIZATION_OUTCOME_UNSPECIFIED = 0;
  TAPE_FINALIZATION_OUTCOME_FINALIZING = 1;
  TAPE_FINALIZATION_OUTCOME_FINALIZED = 2;
  TAPE_FINALIZATION_OUTCOME_FINALIZED_DEGRADED = 3;
  TAPE_FINALIZATION_OUTCOME_RECOVERY_REQUIRED = 4;
  TAPE_FINALIZATION_OUTCOME_FAILED = 5;
  // Exact tape ownership is held by an in-flight Object/read operation or by
  // another close-out admission. No state or media motion occurred.
  TAPE_FINALIZATION_OUTCOME_BUSY = 6;
}

message TapeIndexReplicaHealth {
  uint32 replica_ordinal = 1;
  enum State {
    TAPE_INDEX_REPLICA_STATE_UNSPECIFIED = 0;
    TAPE_INDEX_REPLICA_STATE_PENDING = 1;
    TAPE_INDEX_REPLICA_STATE_COMPLETE = 2;
    TAPE_INDEX_REPLICA_STATE_INVALID = 3;
    TAPE_INDEX_REPLICA_STATE_UNKNOWN = 4;
    // Header/footer, local placement, and common edition facts agree. Fast
    // inventory did not stream this older member's payload.
    TAPE_INDEX_REPLICA_STATE_ENVELOPE_VALID = 5;
  }
  State state = 2;
  string detail = 3;
}

// Historical write-progress evidence. This does not claim that a replica is
// readable or healthy at the time the status is queried; only inventory or
// full verification may make that observation-backed claim.
message TapeIndexReplicaProgress {
  uint32 replica_ordinal = 1;
  enum State {
    TAPE_INDEX_REPLICA_PROGRESS_STATE_UNSPECIFIED = 0;
    TAPE_INDEX_REPLICA_PROGRESS_STATE_PENDING = 1;
    // The replica's trailing filemark, zero-count barrier, and external
    // checkpoint progress were durably proved in the finalization history.
    // Parity-enabled histories additionally prove the sink-journal transition.
    TAPE_INDEX_REPLICA_PROGRESS_STATE_BARRIER_PROVED = 2;
    // Finalization stopped at or immediately before this replica and current
    // completion cannot be inferred from historical progress alone.
    TAPE_INDEX_REPLICA_PROGRESS_STATE_COMPLETION_UNKNOWN = 3;
  }
  State state = 2;
  string detail = 3;
}

message TapeInventoryRequest {
  // Exact 16-byte Remanence tape UUID. Voltags are deliberately not accepted.
  bytes tape_uuid = 1;
}

// One bounded event in the book-like inventory stream. Replica rows are
// provisional until the final summary selects their attempt_id: payload
// validation can reject C after emitting rows, then continue with B and A.
message TapeInventoryStreamItem {
  oneof item {
    TapeInventoryReplicaAttemptStarted replica_attempt_started = 1;
    TapeInventoryStructuralEntry structural_entry = 2;
    TapeInventoryObjectRow object_row = 3;
    TapeInventoryReplicaAttemptRejected replica_attempt_rejected = 4;
    TapeInventoryBotObject bot_object = 5;
    TapeInventory summary = 6;
  }
}

message TapeInventoryReplicaAttemptStarted {
  uint64 attempt_id = 1;
  uint32 replica_ordinal = 2;
}

message TapeInventoryReplicaAttemptRejected {
  uint64 attempt_id = 1;
  uint32 replica_ordinal = 2;
  string failure_kind = 3;
  string detail = 4;
}

enum TapeInventoryStructuralKind {
  TAPE_INVENTORY_STRUCTURAL_KIND_UNSPECIFIED = 0;
  TAPE_INVENTORY_STRUCTURAL_KIND_OBJECT = 1;
  TAPE_INVENTORY_STRUCTURAL_KIND_PARITY_SIDECAR = 2;
  TAPE_INVENTORY_STRUCTURAL_KIND_BOOTSTRAP = 3;
  TAPE_INVENTORY_STRUCTURAL_KIND_PARITY_MAP = 4;
  TAPE_INVENTORY_STRUCTURAL_KIND_TAPE_INDEX_REPLICA = 5;
  TAPE_INVENTORY_STRUCTURAL_KIND_INDEX_SEPARATION_EXTENT = 6;
}

message TapeInventoryStructuralEntry {
  uint64 attempt_id = 1;
  uint32 replica_ordinal = 2;
  uint64 tape_file_number = 3;
  TapeInventoryStructuralKind kind = 4;
  uint64 block_count = 5;
  optional uint64 first_parity_data_ordinal = 6;
  optional uint64 protected_ordinal_start = 7;
  optional uint64 protected_ordinal_end_exclusive = 8;
  optional uint64 epoch_id = 9;
}

message TapeInventoryPlaintextRecovery {
  uint64 manifest_first_chunk_lba = 1;
  uint64 manifest_size_bytes = 2;
  uint64 manifest_chunk_count = 3;
  bytes manifest_sha256 = 4;
}

message TapeInventoryEncryptedRecovery {
  repeated bytes recipient_epoch_ids = 1;
  uint64 metadata_frame_len = 2;
  uint32 key_frame_len = 3;
}

message TapeInventoryObjectRow {
  uint64 attempt_id = 1;
  uint32 replica_ordinal = 2;
  uint64 tape_file_number = 3;
  uint64 stored_block_count = 4;
  bytes object_id = 5;
  oneof representation {
    TapeInventoryPlaintextRecovery plaintext = 6;
    TapeInventoryEncryptedRecovery encrypted = 7;
  }
}

enum TapeInventoryBotObjectState {
  TAPE_INVENTORY_BOT_OBJECT_STATE_UNSPECIFIED = 0;
  TAPE_INVENTORY_BOT_OBJECT_STATE_RECOVERED = 1;
  TAPE_INVENTORY_BOT_OBJECT_STATE_UNKNOWN = 2;
  TAPE_INVENTORY_BOT_OBJECT_STATE_INCOMPLETE = 3;
}

message TapeInventoryBotObject {
  uint64 tape_file_number = 1;
  uint64 stored_block_count = 2;
  optional bytes object_id = 3;
  TapeInventoryBotObjectState state = 4;
}

enum TapeInventoryOutcome {
  TAPE_INVENTORY_OUTCOME_UNSPECIFIED = 0;
  TAPE_INVENTORY_OUTCOME_COMPLETE = 1;
  TAPE_INVENTORY_OUTCOME_DEGRADED = 2;
  // No terminal member is authoritative. The caller must invoke structural
  // recovery from BOT; zero counts in this outcome are never empty success.
  TAPE_INVENTORY_OUTCOME_BOT_STRUCTURAL_RECOVERY_REQUIRED = 3;
  // No terminal member survived, but the daemon completed the explicit BOT
  // structural recovery and classified every physical Object candidate.
  TAPE_INVENTORY_OUTCOME_BOT_STRUCTURAL_RECOVERED = 4;
}

message TapeInventory {
  bytes tape_uuid = 1;
  TapeInventoryOutcome outcome = 2;
  // One-based member ordinal (A=1, B=2, C=3); selection prefers C, then B,
  // then A. Zero only for BOT recovery required.
  uint32 selected_replica_ordinal = 3;
  repeated TapeIndexReplicaHealth replica_health = 4;
  uint64 structural_entry_count = 5;
  uint64 object_row_count = 6;
  bytes edition_digest = 7;
  bytes layout_digest = 8;
  bytes payload_digest = 9;
  bytes canonical_map_digest = 10;
  // Stable basis label: "terminal_index_fast" or
  // "bot_structural_recovery".
  string inventory_basis = 11;
  string detail = 12;
  // BOT recovery classifications are streamed internally; the unary summary
  // stays bounded instead of materialising a whole-tape row set.
  uint64 recovered_object_count = 13;
  uint64 unknown_object_count = 14;
  uint64 incomplete_object_count = 15;
  uint64 damaged_region_count = 16;
  // Attempt whose structural and Object rows are authoritative. Zero for BOT
  // recovery outcomes, whose rows use TapeInventoryBotObject instead.
  uint64 selected_attempt_id = 17;
}

message VerifyTapeIndexRequest {
  // Exact 16-byte Remanence tape UUID. Voltags are deliberately not accepted.
  bytes tape_uuid = 1;
}

enum TapeIndexVerificationState {
  TAPE_INDEX_VERIFICATION_STATE_UNSPECIFIED = 0;
  // Retained for older daemons that truthfully lacked the physical verifier.
  TAPE_INDEX_VERIFICATION_STATE_DEFERRED_FULL_PHYSICAL_VERIFY = 1;
  // Every physical prefix row and all five terminal components validated.
  TAPE_INDEX_VERIFICATION_STATE_VERIFIED_COMPLETE = 2;
  // The canonical physical prefix has a valid survivor, but one or more
  // redundant replicas/separations are damaged or incomplete.
  TAPE_INDEX_VERIFICATION_STATE_VERIFIED_DEGRADED = 3;
  // No surviving terminal authority could prove the measured physical prefix;
  // explicit BOT recovery evidence is attached.
  TAPE_INDEX_VERIFICATION_STATE_RECOVERY_REQUIRED = 4;
}

message TapeIndexSeparationHealth {
  // One-based gap ordinal (AB=1, BC=2).
  uint32 separation_ordinal = 1;
  enum State {
    TAPE_INDEX_SEPARATION_STATE_UNSPECIFIED = 0;
    TAPE_INDEX_SEPARATION_STATE_VALID = 1;
    TAPE_INDEX_SEPARATION_STATE_INVALID = 2;
    TAPE_INDEX_SEPARATION_STATE_UNKNOWN = 3;
  }
  State state = 2;
  // Number of zero-filled interior records read and validated.
  uint64 verified_interior_record_count = 3;
  string detail = 4;
}

message TapeIndexVerification {
  bytes tape_uuid = 1;
  TapeIndexVerificationState state = 2;
  // Present only in the legacy deferred response. A verified response carries
  // full physical evidence below and does not pretend fast inventory was the
  // basis of verification.
  TapeInventory fast_inventory = 3;
  string detail = 4;
  repeated TapeIndexReplicaHealth replica_health = 5;
  repeated TapeIndexSeparationHealth separation_health = 6;
  uint64 measured_eod_lba = 7;
  uint64 verified_prefix_tape_file_count = 8;
  uint64 verified_prefix_record_count = 9;
  uint64 measured_tape_file_count = 10;
  bytes edition_digest = 11;
  bytes layout_digest = 12;
  bytes payload_digest = 13;
  bytes canonical_map_digest = 14;
  // Stable basis label: "measured_full_physical" or
  // "bot_structural_recovery".
  string verification_basis = 15;
  // Present only for RECOVERY_REQUIRED. This is a real BOT scan summary, not
  // a zero-count placeholder or fast terminal inventory.
  TapeInventory recovery_inventory = 16;
}

message TapeFinalization {
  bytes tape_uuid = 1;
  bytes operation_id = 2;
  TapeFinalizationProgress progress = 3;
  uint32 completed_replicas = 4;
  // Deprecated draft field. Finalization no longer claims observation-backed
  // media health; servers leave this empty. Retaining tag 5 prevents older
  // clients from decoding progress states as health states.
  repeated TapeIndexReplicaHealth replica_health = 5 [deprecated = true];
  bytes edition_digest = 6;
  bytes layout_digest = 7;
  TapeFinalizationOutcome outcome = 8;
  string trigger = 9;
  string detail = 10;
  repeated TapeIndexReplicaProgress replica_progress = 11;
}

// A daemon-local tape eligibility group. Sutradhara decides the policy that maps
// content and copy numbers to pool ids; Remanence enforces that a write session
// only uses tapes from the requested pool and reports pool membership in the
// catalog. Pools may encode copy-wise segregation, content-wise segregation, or
// both (for example "copy-a", "camera", or "camera.copy-a").
message TapePool {
  string pool_id       = 1;
  string display_name  = 2;
  // Optional opaque, fleet-coordinated policy-axis hints for clients.
  // Remanence does not interpret them; enforcement still keys on pool_id.
  string copy_class    = 3;
  string content_class = 4;
}

message TapeFile {
  bytes tape_uuid              = 1;
  uint64 tape_file_number      = 2;
  // "object" | "parity_sidecar" | "parity_map" | "bootstrap" | "catalog"
  string kind                  = 3;
  uint64 block_count           = 4;
  // Set for kind="object".
  bytes object_id              = 5;
  Digest canonical_metadata_digest = 6;
}

enum AppendMode {
  APPEND_MODE_UNSPECIFIED    = 0;
  APPEND_MODE_FRESH          = 1;
  APPEND_MODE_APPEND         = 2;
  APPEND_MODE_RESUME_CONTROL = 3;
  APPEND_MODE_SEAL           = 4;
}

// Object-grain durability. WRITTEN is advisory and must be re-sent after any
// session/stream failure unless a later response reports CHECKPOINTED.
enum AppendDurability {
  APPEND_DURABILITY_UNSPECIFIED  = 0;
  APPEND_DURABILITY_WRITTEN      = 1;
  APPEND_DURABILITY_CHECKPOINTED = 2;
}

message AppendCommitInfo {
  AppendMode append_mode              = 1;
  bytes tape_uuid                     = 2;
  optional string voltag              = 3;
  optional uint64 tape_file_number    = 4;
  uint64 first_body_lba               = 5;
  optional uint64 position_before_lba = 6;
  optional uint64 position_after_lba  = 7;
  optional uint64 journal_record_ordinal = 8;
  optional uint64 estimated_remaining_bytes = 9;
  optional bool sealed_after_write    = 10;
  AppendDurability durability         = 11;
  // Present only for a WRITTEN acknowledgement.
  bytes batch_id                      = 12;
  // Session-local provisional ordinal; never a tape-file locator.
  optional uint64 provisional_ordinal = 13;
}

// One object's catalog-level record. Body-format-agnostic.
message ObjectRecord {
  bytes object_id              = 1;  // primary key: always known
  // Nullable in `objects`: the orchestrator need not supply one, and absent is
  // not the same as an orchestrator that supplied an empty string.
  optional string caller_object_id = 2;  // opaque string from orchestrator (§4.2)
  // The logical-asset identity Sutradhara keys on. For rem-tar-v1 this is the
  // canonical manifest_sha256 / content hash of the object's contents.
  // Nullable: an object catalogued before its content was hashed has none, and
  // the objects_content_hash_idx index is explicitly partial on `is not null`.
  optional bytes content_sha256 = 3;
  // Nullable. A zero-byte object is a real and perfectly ordinary object, so
  // zero cannot double as "size not recorded".
  optional uint64 logical_size_bytes = 4;
  optional string body_format  = 5;  // nullable: derived from the body, once read
  // Caller-supplied opaque metadata (per §4.2). Free-form key/value.
  map<string, string> caller_metadata = 6;
  google.protobuf.Timestamp created_at = 7;
  repeated ObjectCopy copies   = 8;
  AppendCommitInfo append_commit_info = 9;
  // Algorithm-aware mirror of content_sha256. During the compatibility
  // window servers populate both fields with the same SHA-256 value.
  Digest content_digest        = 10;
  // Canonical body-format metadata digest when the catalog has one.
  Digest metadata_digest       = 11;
}

message ObjectCopy {
  bytes  tape_uuid             = 1;
  uint64 tape_file_number      = 2;
  // Within the object, the first BodyLba block of the first file's data.
  // Per rem-tar-v1 §2.1 BodyLba is per-object and starts at 0.
  uint64 first_body_lba        = 3;
  // Catalog-recorded freshness: when did scrub last confirm this copy?
  google.protobuf.Timestamp last_verified_at = 4;
  enum Health {
    OBJECT_COPY_HEALTH_UNSPECIFIED = 0;
    OBJECT_COPY_HEALTH_OK          = 1;
    OBJECT_COPY_HEALTH_SUSPECT     = 2;
    OBJECT_COPY_HEALTH_DEGRADED    = 3; // parity recoverable
    OBJECT_COPY_HEALTH_LOST        = 4;
  }
  Health health                = 5;
  // Pool of the tape when this copy was committed. Empty means unassigned.
  string pool_id               = 6;
  Digest plaintext_digest      = 7;
  Digest stored_digest         = 8;
  // Volume-global block span of this copy's tape file, projected through
  // the copy→tape-file join. The copy occupies
  // [global_start_block, global_end_block), exclusive; the trailing
  // filemark at global_end_block is outside the span. Both fields are
  // present together or absent together. Absent = the tape file predates
  // span capture — absent is never zero, and block 0 is a valid start.
  optional uint64 global_start_block = 9;
  optional uint64 global_end_block   = 10;
}

// A single payload file inside an object (rem-tar-v1: one pax entry).
message FileRecord {
  bytes object_id              = 1;
  // file_id is per-object; UUID assigned by the writer and recorded in pax.
  bytes file_id                = 2;
  string path                  = 3;
  uint64 size_bytes            = 4;
  bytes  file_sha256           = 5;
  // BodyLba within the object where this file's data starts (rem-tar-v1
  // chunk-aligned start). The only nullable column in `object_files`: LBA 0 is
  // a real and common address -- the very start of the body -- so it cannot
  // also stand for "not recorded". Every other field here is NOT NULL, because
  // a catalogued file genuinely does know its own path, size and digest.
  optional uint64 first_chunk_body_lba = 6;
  uint64 chunk_count           = 7;
  // Algorithm-aware mirror of file_sha256. During the compatibility window
  // servers populate both fields with the same SHA-256 value.
  Digest file_digest           = 8;
}

message ListTapesRequest {
  bytes library_uuid = 1; // empty = all libraries known to daemon
  PageToken page_token = 2;
  uint32 page_size     = 3;
  string pool_id       = 4; // empty = all pools and unassigned tapes
  string kind          = 5; // empty = all; explicit callers use "data" or "cleaning"
}
message ListTapesResponse { repeated Tape tapes = 1; PageToken next_page_token = 2; }

message GetTapeRequest      { bytes tape_uuid = 1; }
message ListTapeFilesRequest {
  bytes tape_uuid     = 1;
  PageToken page_token = 2;
  uint32 page_size     = 3;
}
message ListTapeFilesResponse {
  repeated TapeFile tape_files = 1;
  PageToken next_page_token    = 2;
}

message ListTapePoolsRequest {
  PageToken page_token = 1;
  uint32 page_size     = 2;
}
message ListTapePoolsResponse {
  repeated TapePool pools = 1;
  PageToken next_page_token = 2;
}

message GetTapePoolRequest { string pool_id = 1; }

message EnumerateObjectsRequest {
  // Scope: one tape, one library (all tapes in it), or all known tapes.
  oneof scope {
    bytes tape_uuid       = 1;
    bytes library_uuid    = 2;
    google.protobuf.Empty all = 3;
  }
  // If true, bypass SQLite index and read catalog from each tape directly.
  // Slow; intended for full reconciliation.
  bool reconcile_from_tape = 4;
}

message GetObjectRequest {
  oneof key {
    bytes  object_id        = 1; // Remanence daemon-local primary-key UUID
    // Canonical logical-asset identity lookup, not proof that a particular
    // physical copy was measured. The server requires exactly one matching
    // logical object; zero is NOT_FOUND and multiple matches are
    // FAILED_PRECONDITION. Never use this tautological index lookup as
    // deletion evidence; re-derive measured copy evidence at action time.
    bytes  content_sha256   = 2;
    string caller_object_id = 3; // by orchestrator-supplied id
    Digest content_digest   = 4; // algorithm-aware logical-asset identity
  }
}

message FindObjectCopiesRequest {
  oneof key {
    bytes  object_id        = 1;
    bytes  content_sha256   = 2;
    string caller_object_id = 3;
    Digest content_digest   = 4;
  }
}
message FindObjectCopiesResponse {
  ObjectRecord object        = 1;
  repeated ObjectCopy copies = 2;
}

message ReconcileTapeRequest {
  bytes tape_uuid              = 1;
  IdempotencyKey idempotency_key = 2;
}

message ListFilesInObjectRequest {
  bytes object_id     = 1;
  PageToken page_token = 2;
  uint32 page_size     = 3;
}
message ListFilesInObjectResponse {
  repeated FileRecord files   = 1;
  PageToken next_page_token   = 2;
}

message GetFileRequest {
  bytes object_id  = 1;
  // Either file_id OR path within the object.
  oneof key {
    bytes  file_id = 2;
    string path    = 3;
  }
}

// A source-neutral archive container. Native Remanence objects appear here by
// reference to ObjectRecord. Foreign archives appear as derived scan units and
// expose only normalized fields; driver-private restore state stays internal to
// the daemon/catalog cache.
message CatalogUnit {
  bytes unit_id                    = 1;
  bytes tape_uuid                  = 2;
  string format_id                 = 3; // "rem-tar-v1", "bru", "tar-legacy", ...
  CatalogUnitOriginKind origin_kind = 4;
  google.protobuf.Timestamp discovered_at = 5;

  oneof origin {
    NativeUnitSummary native       = 10;
    ForeignArchiveSummary foreign  = 11;
  }
}

enum CatalogUnitOriginKind {
  CATALOG_UNIT_ORIGIN_KIND_UNSPECIFIED = 0;
  CATALOG_UNIT_ORIGIN_KIND_NATIVE_OBJECT = 1;
  CATALOG_UNIT_ORIGIN_KIND_FOREIGN_ARCHIVE = 2;
}

// Native unit summary deliberately references ObjectRecord rather than
// duplicating object/copy fields. ObjectRecord remains authoritative for native
// Remanence object semantics.
message NativeUnitSummary {
  bytes object_id = 1;
}

message ForeignArchiveSummary {
  bytes scan_id = 1;
  string source_kind = 2; // "physical_tape_records" | "byte_stream_dump"
  // Trusted daemon-local source identifier or dump path token. This is not a
  // client-supplied filesystem path; future ingestion RPCs must validate it
  // against configured foreign-source roots before storing it.
  string source_id = 3;
  CatalogScanConfidence confidence = 4;
  google.protobuf.Timestamp last_scan_at = 5;
  uint64 entry_count = 6;
  uint64 damage_event_count = 7;
}

enum CatalogScanConfidence {
  CATALOG_SCAN_CONFIDENCE_UNSPECIFIED = 0;
  CATALOG_SCAN_CONFIDENCE_LOW = 1;
  CATALOG_SCAN_CONFIDENCE_MEDIUM = 2;
  CATALOG_SCAN_CONFIDENCE_HIGH = 3;
}

enum CatalogUnitOriginFilter {
  CATALOG_UNIT_ORIGIN_FILTER_UNSPECIFIED = 0; // all units
  CATALOG_UNIT_ORIGIN_FILTER_NATIVE_OBJECTS = 1;
  CATALOG_UNIT_ORIGIN_FILTER_FOREIGN_ARCHIVES = 2;
}

message EnumerateUnitsRequest {
  oneof scope {
    bytes tape_uuid       = 1;
    bytes library_uuid    = 2;
    google.protobuf.Empty all = 3;
  }
  CatalogUnitOriginFilter origin_filter = 4;
  // If true, foreign units may be re-probed/re-scanned by their driver instead
  // of using the derived cache. Native objects follow EnumerateObjects rules.
  bool refresh_from_source = 5;
}

message GetCatalogUnitRequest {
  bytes unit_id = 1;
}

message CatalogEntry {
  bytes unit_id = 1;
  bytes entry_id = 2; // stable within this unit/scan, driver assigned for foreign units
  string path = 3;
  CatalogEntryKind kind = 4;
  optional uint64 size_bytes = 5;
  google.protobuf.Timestamp mtime = 6;
  CatalogEntryState state = 7;
  IntegrityBasis integrity_basis = 8;
}

enum CatalogEntryKind {
  CATALOG_ENTRY_KIND_UNSPECIFIED = 0;
  CATALOG_ENTRY_KIND_REGULAR_FILE = 1;
  CATALOG_ENTRY_KIND_DIRECTORY = 2;
  CATALOG_ENTRY_KIND_SYMLINK = 3;
  CATALOG_ENTRY_KIND_HARDLINK = 4;
  CATALOG_ENTRY_KIND_SPECIAL = 5;
}

enum CatalogEntryState {
  reserved 5;
  reserved "CATALOG_ENTRY_STATE_UNKNOWN";
  CATALOG_ENTRY_STATE_UNSPECIFIED = 0;
  CATALOG_ENTRY_STATE_COMPLETE = 1;
  CATALOG_ENTRY_STATE_PARTIAL = 2;
  CATALOG_ENTRY_STATE_DAMAGED = 3;
  CATALOG_ENTRY_STATE_UNSUPPORTED = 4;
  // A scan ran but could not classify the entry state. This is distinct from
  // UNSPECIFIED, which means no state was supplied.
  CATALOG_ENTRY_STATE_UNCLASSIFIED = 6;
}

enum IntegrityBasis {
  INTEGRITY_BASIS_UNSPECIFIED = 0;
  INTEGRITY_BASIS_UNKNOWN = 1;
  INTEGRITY_BASIS_CONTENT_HASH = 2;
  INTEGRITY_BASIS_FORMAT_CHECKSUM = 3;
  INTEGRITY_BASIS_PARITY_CONSISTENCY = 4;
}

message ListEntriesInUnitRequest {
  bytes unit_id = 1;
  PageToken page_token = 2;
  uint32 page_size = 3;
  // For foreign units the daemon may re-run ArchiveReader.scan instead of
  // returning a cached derived entry list.
  bool refresh_from_source = 4;
}

message ListEntriesInUnitResponse {
  repeated CatalogEntry entries = 1;
  PageToken next_page_token = 2;
  repeated ArchiveGap archive_gaps = 3;
}

message ArchiveGap {
  bytes unit_id = 1;
  uint64 source_start = 2;
  uint64 source_end = 3;
  ArchiveGapCause cause = 4;
}

enum ArchiveGapCause {
  ARCHIVE_GAP_CAUSE_UNSPECIFIED = 0;
  ARCHIVE_GAP_CAUSE_UNRECOGNIZED_DATA = 1;
  ARCHIVE_GAP_CAUSE_READ_ERROR = 2;
  ARCHIVE_GAP_CAUSE_MISSING = 3;
  ARCHIVE_GAP_CAUSE_RESYNC = 4;
  ARCHIVE_GAP_CAUSE_UNSUPPORTED = 5;
}

// =============================================================================
// WRITE SESSION SERVICE — write objects to tape.
//
// A write session is a server-side resource bound to one drive, one loaded
// tape, and one body format. The orchestrator opens a session, streams one
// or more objects into it, then closes. Sessions are durable across daemon
// restarts up to the last checkpoint; LostByRestart sessions return their
// last known state at OpenWriteSession-recover time.
// =============================================================================

service WriteSessionService {
  rpc OpenWriteSession   (OpenWriteSessionRequest)   returns (WriteSession);

  // Stream one object into the session. The first message in each call must
  // be an AppendObjectStart; subsequent messages are AppendObjectChunk; the
  // last is AppendObjectFinish. In per-object mode the returned ObjectRecord
  // is CHECKPOINTED. In batched mode it may be a locator-free WRITTEN advisory
  // acknowledgement; callers must retain and re-send it after any session or
  // stream failure unless CheckpointSession reports its committed copy.
  rpc AppendObject       (stream AppendObjectMessage) returns (ObjectRecord);

  rpc CheckpointSession  (CheckpointSessionRequest)  returns (CheckpointSessionResponse);
  rpc CloseWriteSession  (CloseWriteSessionRequest)  returns (WriteSession);
  rpc AbortWriteSession  (AbortWriteSessionRequest)  returns (WriteSession);
  rpc GetWriteSession    (GetWriteSessionRequest)    returns (WriteSession);
}

message WriteSession {
  bytes session_id           = 1; // UUID; primary key, always known
  // sessions.tape_uuid is nullable, and for a good reason: a pool-targeted
  // session exists before a tape has been selected for it. Absent means no
  // volume chosen yet, which is a normal state, not a missing one.
  optional bytes tape_uuid   = 2;
  // sessions.drive_bay is nullable: a session can be open without currently
  // holding a drive. Bay 0 is a real bay, so zero cannot also mean "none".
  optional uint32 drive_element_address = 3;
  string body_format         = 4;  // fixed when the session opens; always known
  enum State {
    WRITE_SESSION_STATE_UNSPECIFIED = 0;
    WRITE_SESSION_STATE_OPEN        = 1;
    WRITE_SESSION_STATE_CHECKPOINTED = 2;
    WRITE_SESSION_STATE_CLOSED      = 3;
    WRITE_SESSION_STATE_ABORTED     = 4;
    WRITE_SESSION_STATE_ORPHANED    = 5; // dropped by daemon restart, recoverable
    WRITE_SESSION_STATE_LOST        = 6; // unrecoverable
  }
  State state                = 5;
  uint64 objects_committed   = 6;
  uint64 bytes_committed     = 7;
  google.protobuf.Timestamp opened_at = 8;
  google.protobuf.Timestamp last_checkpoint_at = 9;
  enum TargetKind {
    WRITE_SESSION_TARGET_KIND_UNSPECIFIED = 0;
    WRITE_SESSION_TARGET_KIND_PINNED_TAPE = 1;
    WRITE_SESSION_TARGET_KIND_POOL        = 2;
  }
  TargetKind target_kind      = 10;
  repeated bytes tape_sequence = 11;
  uint32 current_tape_index   = 12;
  uint64 pending_checkpoint_objects = 13;
  uint64 pending_checkpoint_bytes = 14;
  // Age of the oldest object still awaiting a checkpoint. Absent when nothing
  // is pending -- which is not the same as something pending for zero seconds,
  // the state of every object the instant it is written. Same conflation as
  // Drive.mount_age_seconds had.
  optional uint64 oldest_pending_age_seconds = 15;
  google.protobuf.Timestamp checkpoint_deadline = 16;
  // Durable receipts not previously returned by CheckpointSession. A close
  // response carries these so close-triggered barriers do not lose locators.
  repeated ObjectRecord checkpointed_objects = 17;
  repeated ObjectCopy committed_copies = 18;
}

message OpenWriteSessionRequest {
  // Pick a target. Either (library_uuid + drive) with current tape, or
  // ask the daemon to load a specific tape into any free drive.
  oneof target {
    DriveTarget   drive_target = 1;
    TapeTarget    tape_target  = 2;
    TapePoolTarget pool_target  = 6;
  }
  // Absent means "no preference, use the daemon's default" -- the only wired
  // format, rem-object-v1. Present-and-empty is a caller that named no format
  // at all, which is a malformed request rather than a request for the
  // default, and is refused.
  optional string body_format    = 3;
  IdempotencyKey idempotency_key = 4;
  // Recover an existing orphaned session by id (no new session created).
  // Absent is an ordinary open; an id is only ever present because the caller
  // is resuming something.
  optional bytes recover_session_id = 5;
}

message DriveTarget {
  bytes library_uuid           = 1;
  uint32 drive_element_address = 2;
  // Optional guard: if set, the currently loaded tape must be in this pool.
  string required_pool_id      = 3;
}

message TapeTarget {
  bytes tape_uuid              = 1;
  // If true and no drive currently holds this tape, daemon mounts it.
  bool mount_if_needed         = 2;
  // Pool guard. For WRITE sessions it is mandatory: pinning a tape replaces
  // pool *selection*, never *admission* — the caller must name the pool it
  // believes the tape belongs to, and a mismatch is a refusal. Pools carry
  // copy-class segregation, so a silent cross-pool write is policy
  // corruption; the guard makes the caller's intent checkable. For READ
  // sessions the guard remains an optional constraint (reading does not
  // move data between pools).
  string required_pool_id      = 3;
  // Write sessions only: explicit acknowledgment for targeting a tape with
  // no pool assignment. Mutually exclusive with required_pool_id. (Not
  // wired yet: servers currently reject it as unimplemented.)
  bool allow_unpooled          = 4;
}

message TapePoolTarget {
  string pool_id               = 1;
  bytes library_uuid           = 2; // optional library constraint
  bool mount_if_needed         = 3;
}

message AppendObjectMessage {
  oneof payload {
    AppendObjectStart  start  = 1;
    AppendObjectChunk  chunk  = 2;
    AppendObjectFinish finish = 3;
  }
}

enum SourceReplayCapability {
  SOURCE_REPLAY_CAPABILITY_UNSPECIFIED       = 0;
  SOURCE_REPLAY_CAPABILITY_REPLAY_FROM_START = 1;
}

message AppendObjectStart {
  bytes session_id                    = 1;
  // §4.2 orchestrator opaque id. REQUIRED, and plain for that reason: an
  // append that names no object is refused (rem-object layout admission,
  // "caller_object_id must not be empty", surfaced as INVALID_ARGUMENT), so
  // absence here is a rejected request rather than a value the daemon has to
  // interpret. `objects.caller_object_id` is nullable and no writer fills it
  // with NULL; see tools/wire-presence-ledger.txt for that mismatch.
  string caller_object_id             = 2;
  map<string, string> caller_metadata = 3; // §4.2 opaque metadata
  // Declared size for capacity-reserve planning (rem-tar-v1 §9.1 P1
  // projected_size_blocks). Absent means the caller does not know, and the
  // daemon estimates. Zero is a declaration that the object is empty, which is
  // an ordinary object -- the same reason ObjectRecord.size_bytes is optional.
  optional uint64 declared_size_bytes = 4;
  // For rem-tar-v1: pre-supplied per-file manifest (paths, sizes, hashes,
  // optional pre-computed file_sha256). The writer validates and writes
  // accordingly. The exact shape is body-format-specific; this draft leaves
  // it as a serialized blob owned by the format adapter. Absent means the
  // caller supplied no manifest.
  optional bytes body_format_manifest = 5;
  // Binding payload digest used for overlap admission. New clients mirror
  // this value in AppendObjectFinish during the compatibility window. Absent
  // means the caller pre-computed no digest, so there is nothing to bind
  // against; it is not a digest of no bytes.
  optional bytes expected_content_sha256 = 6;
  // Whether the caller retains immutable source bytes and can replay them
  // from byte zero after an interrupted overlap append.
  SourceReplayCapability source_replay_capability = 7;
  // Algorithm-aware mirror of expected_content_sha256.
  Digest expected_content_digest = 8;
}

message AppendObjectChunk {
  bytes session_id = 1;
  bytes data       = 2; // file data, in body-format-defined order
}

message AppendObjectFinish {
  bytes session_id = 1;
  // If client pre-computed the object's content_sha256, daemon validates
  // before committing. Absent means it computed none.
  optional bytes expected_content_sha256 = 2;
  // Algorithm-aware mirror of expected_content_sha256.
  Digest expected_content_digest = 3;
}

message CheckpointSessionRequest {
  bytes session_id               = 1;
  IdempotencyKey idempotency_key = 2;
}

message CheckpointSessionResponse {
  WriteSession session = 1;
  // Durable objects not previously returned by CheckpointSession, retained
  // across automatic threshold/timer barriers for caller correlation.
  repeated ObjectRecord committed_objects = 2;
  // The corresponding committed-copy set. Callers register copies, enqueue
  // verification, and release retained source bytes only from this field.
  repeated ObjectCopy committed_copies = 3;
}

message CloseWriteSessionRequest {
  bytes session_id               = 1;
  IdempotencyKey idempotency_key = 2;
}

message AbortWriteSessionRequest {
  bytes session_id               = 1;
  IdempotencyKey idempotency_key = 2;
  // Why the caller is abandoning the session. Absent means the caller gave no
  // reason -- an abort with no explanation is a normal thing for a client that
  // is itself dying, and is not the same as one that explained itself with an
  // empty string.
  optional string reason         = 3;
}

message GetWriteSessionRequest { bytes session_id = 1; }

// =============================================================================
// READ SESSION SERVICE — read objects / byte ranges from tape.
//
// A read session pins a drive + loaded tape and lets the caller issue many
// read RPCs at low overhead. For one-off reads, OpenReadSession + a single
// ReadObjectRange + CloseReadSession is fine.
// =============================================================================

service ReadSessionService {
  rpc OpenReadSession  (OpenReadSessionRequest)  returns (ReadSession);
  rpc CloseReadSession (CloseReadSessionRequest) returns (ReadSession);
  rpc GetReadSession   (GetReadSessionRequest)   returns (ReadSession);

  // Read a whole object payload or a byte range from it.
  // Empty file_id resolves the object's sole payload member and treats
  // [start_byte, end_byte) as object/payload-relative offsets over opaque
  // stored bytes. Non-empty file_id resolves that catalog member and treats the
  // range as member-relative. The daemon does not decrypt or interpret payload
  // bytes; both-zero range reads the whole payload/member.
  rpc ReadObjectRange  (ReadObjectRangeRequest)  returns (stream BytesChunk);

  // Read an entire file from an object.
  rpc ReadFile         (ReadFileRequest)         returns (stream BytesChunk);
}

message ReadSession {
  bytes session_id           = 1;  // primary key, always known
  // A read session can be opened against a DRIVE rather than a named tape --
  // "read whatever is seated here" -- so the volume's identity need not be
  // known at open, and may stay unknown for an unidentified or foreign tape.
  // Absent is a session reading a volume it cannot yet name, not a session
  // with no volume.
  optional bytes tape_uuid   = 2;
  // Nullable in `sessions`: a session opened against a TapeTarget exists before
  // the volume is mounted, so it holds no bay yet. Bay 0 is a real bay.
  optional uint32 drive_element_address = 3;
  enum State {
    READ_SESSION_STATE_UNSPECIFIED = 0;
    READ_SESSION_STATE_OPEN        = 1;
    READ_SESSION_STATE_CLOSED      = 2;
    READ_SESSION_STATE_LOST        = 3;
  }
  State state                = 4;
  google.protobuf.Timestamp opened_at = 5;
  // Present after a cold resume open. Encoded identically to the write-side
  // AppendCommitInfo.position_after_lba field.
  DevicePositionProof position_proof = 6;
  // Epoch of the daemon that minted this fresh read session.
  uint64 daemon_epoch = 7;
}

message OpenReadSessionRequest {
  oneof target {
    DriveTarget drive_target = 1;
    TapeTarget  tape_target  = 2;
  }
  IdempotencyKey idempotency_key = 3;
  // Durable coordinates for a cold resume. This deliberately contains no
  // session_id: every resume open creates a fresh read session.
  ReadResumeTarget resume_target = 4;
}

message ReadResumeTarget {
  bytes tape_uuid                    = 1;
  bytes object_id                    = 2;
  bytes file_id                      = 3;
  // Object-local byte offset of the file's first body chunk. The server
  // rejects offsets that do not equal the catalogued file boundary.
  uint64 file_boundary_byte_offset   = 4;
  optional uint64 expected_position_lba = 5;
  optional uint64 daemon_epoch       = 6;
}

// Caller-visible proof produced by READ POSITION after resume positioning.
message DevicePositionProof {
  // Uses the established AppendCommitInfo.position_after_lba uint64 LBA wire
  // representation; it is not a byte offset.
  uint64 position_after_lba = 1;
}

message CloseReadSessionRequest {
  bytes session_id               = 1;
  IdempotencyKey idempotency_key = 2;
}

message GetReadSessionRequest { bytes session_id = 1; }

message ReadObjectRangeRequest {
  bytes session_id   = 1;
  bytes object_id    = 2;
  // Empty = object/payload-relative range over the sole payload member.
  // Non-empty = member-relative range resolved via the object file catalog.
  bytes file_id      = 3;
  // Half-open byte range [start_byte, end_byte). If both zero, reads the whole
  // payload/member. Bytes are opaque; clients perform any decryption.
  uint64 start_byte  = 4;
  uint64 end_byte    = 5;
  // Suggested chunk size for stream framing (server may use a different
  // size). 0 = server default.
  uint32 stream_chunk_bytes = 6;
}

message ReadFileRequest {
  bytes session_id    = 1;
  bytes object_id     = 2;
  bytes file_id       = 3;
  uint32 stream_chunk_bytes = 4;
}

message BytesChunk {
  bytes data    = 1;
  bool  is_last = 2;
}

// =============================================================================
// READ PLAN SERVICE — batch read ordering over one volume.
//
// Contract of record: design-read-ordering.md §§9 and 11 (private journal).
// The RPC accepts targets to *reason about*: it requires no read session,
// performs no tape motion, and returns an ordering with per-hop positioning
// estimates. The read surface (ReadSessionService) is unchanged — callers
// issue their own reads, one per call, in the order returned. The plan is
// advice, not a contract: reads address data by object identifier and byte
// range, never by block number, so an outdated plan is suboptimal, never
// incorrect.
//
// Unavailability is a normal, cacheable result, not an RPC error. Only
// malformed requests are errors (INVALID_ARGUMENT), carrying a
// google.rpc.BadRequest detail that names the offending target by its index
// in `targets` — `tag` is opaque bytes and may not be printable.
// =============================================================================

service ReadPlanService {
  rpc PlanBatchRead (PlanBatchReadRequest) returns (PlanBatchReadResponse);
}

message ReadTarget {                 // shared with future BatchReadRange
  uint32 partition        = 1;
  uint64 start_block      = 2;
  uint64 end_block        = 3;       // required; must be >= start_block
  bytes  tag              = 4;       // opaque; echoed back
}

enum PlanObjective {
  OBJECTIVE_UNSPECIFIED = 0;         // treated as MIN_TOTAL_TIME
  MIN_TOTAL_TIME        = 1;
  MIN_TIME_TO_FIRST     = 2;
}

enum CompressionState {
  COMPRESSION_UNSPECIFIED = 0;       // NOT a synonym for disabled
  COMPRESSION_DISABLED    = 1;
  COMPRESSION_ENABLED     = 2;
}

message CartridgeFacts {
  string           cartridge_generation = 1;  // e.g. "LTO-7"; empty = derive from voltag
  string           recording_format     = 2;  // e.g. "L7", "M8"
  string           voltag               = 3;  // barcode; resolve by the canonical §6.3 table
  uint64           block_size_bytes     = 4;
  CompressionState compression          = 5;
  uint64           written_extent_lba   = 6;  // exclusive; last written block + 1
}
// Note: no capacity field. Wrap boundaries come from the cached REOWP map
// (§6.5), not from arithmetic over a published capacity. Generation and
// format are still needed, but only to look up bands and wraps-per-band
// for the second-order band-step cost term (§6.3).

message StartPosition {
  uint32 partition = 1;              // MUST be 0 in v1
  uint64 block     = 2;
}

message PlanBatchReadRequest {
  CartridgeFacts       cartridge       = 1;
  repeated ReadTarget  targets         = 2;
  PlanObjective        objective       = 3;
  StartPosition        start_position  = 4;   // absent = load point, see §8.3
  StartPosition        end_position    = 5;   // absent = no terminal position
  bytes                tape_uuid       = 6;   // required; exactly 16 bytes; per-volume map key
}

enum PlanStatus {
  PLAN_STATUS_UNSPECIFIED              = 0;   // sentinel; never emitted
  OK                                   = 1;
  DEGRADED_ASCENDING_FALLBACK          = 2;
  UNAVAILABLE_UNKNOWN_BLOCK_SIZE       = 3;
  UNAVAILABLE_COMPRESSION_ENABLED      = 4;
  UNAVAILABLE_UNKNOWN_COMPRESSION      = 5;   // caller left it UNSPECIFIED
  UNAVAILABLE_UNSUPPORTED_FORMAT       = 6;   // known row, marked unsupported
  UNAVAILABLE_UNKNOWN_FORMAT           = 7;   // no row for this key
  UNAVAILABLE_UNKNOWN_EXTENT           = 8;   // written_extent_lba absent or zero
  UNAVAILABLE_UNCALIBRATED             = 9;   // no map, or write-epoch mismatch
  UNAVAILABLE_MAP_STALE                = 10;  // coverage gap beyond mapped_extent_lba only
}

enum CostModelBasis {
  COST_MODEL_BASIS_UNSPECIFIED = 0;
  PRIORS                       = 1;
  FITTED                       = 2;
}

message PlannedHop {
  ReadTarget target                 = 1;
  uint64     estimated_locate_ns    = 2;      // from previous target's end
}

message ResolvedGeometryKey {
  string cartridge_generation = 1;
  string recording_format     = 2;
}

message PlanBatchReadResponse {
  PlanStatus           status                = 1;
  string               detail                = 2;   // human; never parsed
  repeated PlannedHop  hops                  = 3;   // ordered; empty unless OK or DEGRADED
  uint64               estimated_total_ns    = 4;
  CostModelBasis       cost_model_basis      = 5;
  ResolvedGeometryKey  resolved_key          = 6;   // both halves, not one
  bool                 format_disagreement   = 7;   // diagnostic only; see below
  uint32               max_targets           = 8;   // always MAX_TARGETS (2730)
  uint64               calibration_generation = 9;  // key for calibration-derived negatives
  bool                 uses_estimated_eod_geometry = 10;
}

// =============================================================================
// AUDIT SERVICE — read-only audit log queries.
//
// The append-only audit log is daemon-authoritative (layer4 addendum §5).
// Layer 5 exposes query-only surface; mutations only happen through the
// other services.
// =============================================================================

service Audit {
  rpc QueryAudit (QueryAuditRequest) returns (stream AuditEntry);
}

message QueryAuditRequest {
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
  // Filter by operation_id, session_id, subject, event kind, actor, etc.
  map<string, string> filter      = 3;
}

message AuditEntry {
  uint64 sequence              = 1;
  google.protobuf.Timestamp timestamp = 2;
  string actor                 = 3;
  string source_layer          = 4; // "layer2", "layer3a", "layer3c", "layer5"
  bytes  operation_id          = 5;
  bytes  session_id            = 6;
  string event_kind            = 7; // see layer4 addendum §5.2
  // Free-form structured detail; CBOR-encoded in the on-disk log, JSON-ified
  // here for client convenience.
  string detail_json           = 8;
  // Producing crate version plus build-time git description. Absent only for
  // audit records written before this field was introduced.
  optional string software_build = 9;
}
